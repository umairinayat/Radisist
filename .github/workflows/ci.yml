name: Radisist CI
on:
  push:
    branches: [main, feat/*]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python radisist/radisist_backend/manage.py check
      - run: python -m py_compile app/models/tanet.py app/pipeline/orchestrator.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm --prefix radisist/radisist-frontend ci
      - run: npm --prefix radisist/radisist-frontend run build
